[project]
name = "antisemitism-detection"
version = "0.1.0"
description = "EE-559 Mini-Project: Transformer-based antisemitism detection in social media text"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "EPFL EE-559 Group"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
