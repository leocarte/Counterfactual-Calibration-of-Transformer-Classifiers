[project]
name = "antisemitism-detection"
version = "0.1.0"
description = "Counterfactual calibration and invariance for transformer-based antisemitism detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Giacomo Case"},
    {name = "Yasmin Chaqor"},
    {name = "Leonardo Cartesegna"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
