# Smoke variant of cci_v2_fixed_js_roberta_large.yaml — 1 epoch, fast fail.
defaults:
  - base

experiment_name: "cci_v2_fixed_js_roberta_large_smoke"

model:
  name: "roberta-large"
  num_labels: 2
  dropout: 0.1
  freeze_embeddings: false

training:
  epochs: 1
  batch_size: 4
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: "fp32"               # M2 fix: bf16+focal has underflow on (1-p_t)**gamma; project-wide fp32 rule
  gradient_accumulation_steps: 4

  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.75

  lambda_cci: 1.0
  cci_temperature_learnable: false
  cci_divergence: "js"
  cci_init_T: 1.0
  cci_T_min: 0.5
  cci_T_max: 5.0
  cci_positive_class_index: 1

  cf_swaps_per_token: 3
  cf_pairs_cap_per_example: 5
  cf_symmetry_filter: "heuristic"

  patience: 1
  metric_for_best_model: "macro_f1"

  keyword_masking: false
  keyword_mask_prob: 0.0

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc", "ece"]
  per_keyword: true
