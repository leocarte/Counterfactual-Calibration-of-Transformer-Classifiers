# Smoke variant of model_c_deberta_v3_large.yaml — 1 epoch, fast fail.
defaults:
  - base

experiment_name: "model_c_deberta_v3_large_smoke"

model:
  name: "microsoft/deberta-v3-large"
  num_labels: 2
  dropout: 0.1
  freeze_embeddings: false

training:
  epochs: 1
  batch_size: 4
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: "fp32"
  gradient_accumulation_steps: 4

  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.75

  patience: 1
  metric_for_best_model: "macro_f1"

  keyword_masking: true
  keyword_mask_prob: 0.3

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc", "ece"]
  per_keyword: true
