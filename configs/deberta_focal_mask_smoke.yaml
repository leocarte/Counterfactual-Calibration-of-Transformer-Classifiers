# SMOKE-TEST: Model C (DeBERTa + Focal + Keyword Masking), 1 epoch.
# Pipeline validation only — exercises focal loss + masking augmentation.
# For real run: use configs/deberta_focal_mask.yaml.
defaults:
  - base

experiment_name: "smoke_c_deberta_focal_mask"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 2
  dropout: 0.1
  freeze_embeddings: false

training:
  epochs: 1
  batch_size: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: "fp32"   # DeBERTa-v3 disentangled attention overflows in bf16/fp16 (NaN loss by step 5)
  gradient_accumulation_steps: 4
  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.75
  patience: 1
  metric_for_best_model: "macro_f1"
  keyword_masking: true
  keyword_mask_prob: 0.3

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc", "ece"]
  per_keyword: false
