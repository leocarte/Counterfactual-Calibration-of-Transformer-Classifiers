# Model D3: LLM Guided Chain-of-Thought (replicating Patel et al. EMNLP 2025)
defaults:
  - base

experiment_name: "model_d3_llm_guided_cot"

llm:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  quantization: "4bit"
  max_new_tokens: 300  # CoT needs more tokens for reasoning
  temperature: 0.0
  do_sample: false
  prompt_template: "guided_cot"
  use_vllm: false
  batch_size: 4  # smaller batch for longer outputs

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc"]
  per_keyword: true
  eval_split: "test"
