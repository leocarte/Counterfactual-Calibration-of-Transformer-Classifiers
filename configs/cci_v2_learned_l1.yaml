# CCI v2 — learned per-group T + L1 divergence (ablation)
defaults:
  - base

experiment_name: "cci_v2_learned_l1"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 2
  dropout: 0.1
  freeze_embeddings: false

training:
  epochs: 7
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: "fp32"
  gradient_accumulation_steps: 2

  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.75

  lambda_cci: 1.0
  cci_temperature_learnable: true
  cci_divergence: "l1"
  cci_init_T: 1.0
  cci_T_min: 0.5
  cci_T_max: 5.0
  cci_positive_class_index: 1

  cf_swaps_per_token: 3
  cf_pairs_cap_per_example: 5
  cf_symmetry_filter: "heuristic"

  patience: 3
  metric_for_best_model: "macro_f1"

  keyword_masking: false
  keyword_mask_prob: 0.0

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc", "ece"]
  per_keyword: true
