# Model C: DeBERTa-v3-base + Focal Loss + Keyword Masking
defaults:
  - base

experiment_name: "model_c_deberta_focal_mask"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 2
  dropout: 0.1
  freeze_embeddings: false

training:
  epochs: 7  # slightly more epochs since focal loss converges slower
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: "fp32"   # DeBERTa-v3 disentangled attention overflows in bf16/fp16 (NaN); fp32 is standard for DeBERTa-v3
  gradient_accumulation_steps: 2  # effective batch size = 8 * 2 = 16

  # Focal loss parameters
  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.75

  patience: 3
  metric_for_best_model: "macro_f1"

  # Keyword masking augmentation — THE NOVEL CONTRIBUTION
  keyword_masking: true
  keyword_mask_prob: 0.3

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc", "ece"]
  per_keyword: true
