# Model D2: LLM Few-Shot Prompting
defaults:
  - base

experiment_name: "model_d2_llm_fewshot"

llm:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  quantization: "4bit"
  max_new_tokens: 50
  temperature: 0.0
  do_sample: false
  prompt_template: "few_shot"
  num_examples: 5  # per class, diverse by keyword
  use_vllm: false
  batch_size: 8

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc"]
  per_keyword: true
  eval_split: "test"
