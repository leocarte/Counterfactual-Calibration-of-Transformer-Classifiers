# Smoke config for Davani CLP — 1 epoch, fast feedback.
# Used to sanity-check the pipeline end-to-end before launching the 6-seed sweep.
defaults:
  - base

experiment_name: "davani_smoke"

model:
  name: "microsoft/deberta-v3-base"
  num_labels: 2
  dropout: 0.1
  freeze_embeddings: false

training:
  epochs: 1
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: "fp32"
  gradient_accumulation_steps: 2

  loss_type: "focal"
  focal_gamma: 2.0
  focal_alpha: 0.75

  lambda_clp: 1.0
  clp_divergence: "l1"
  clp_positive_class_index: 1
  cf_swaps_per_token: 2
  cf_pairs_cap_per_example: 3
  cf_symmetry_filter: "heuristic"

  patience: 1
  metric_for_best_model: "macro_f1"

  keyword_masking: false
  keyword_mask_prob: 0.0

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc", "ece"]
  per_keyword: false
