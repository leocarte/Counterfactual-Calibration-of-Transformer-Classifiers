# SMOKE-TEST: Mistral-7B-Instruct few-shot — 20 samples only.
defaults:
  - base

experiment_name: "smoke_d2_mistral_fewshot"

llm:
  model_name: "mistralai/Mistral-7B-Instruct-v0.3"
  quantization: "4bit"
  max_new_tokens: 50
  temperature: 0.0
  do_sample: false
  prompt_template: "few_shot"
  use_vllm: false
  batch_size: 4
  limit: 20

evaluation:
  metrics: ["macro_f1", "precision", "recall"]
  per_keyword: false
  eval_split: "test"
