# Model D1 alternative: Mistral-7B-Instruct Zero-Shot Prompting
defaults:
  - base

experiment_name: "model_d1_mistral_zeroshot"

llm:
  model_name: "mistralai/Mistral-7B-Instruct-v0.3"
  quantization: "4bit"
  max_new_tokens: 50
  temperature: 0.0
  do_sample: false
  prompt_template: "zero_shot"
  use_vllm: false
  batch_size: 8

evaluation:
  metrics: ["macro_f1", "precision", "recall", "pr_auc"]
  per_keyword: true
  eval_split: "test"
